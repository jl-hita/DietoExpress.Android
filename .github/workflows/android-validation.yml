name: Android validation

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch:

# Evita gastar runners en ejecuciones obsoletas del mismo PR o rama.
# Una ejecución nueva cancela la anterior del mismo grupo.
concurrency:
  group: android-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile instrumented tests (no emulator)
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
