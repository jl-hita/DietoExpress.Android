name: Android validation

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch:

# Evita gastar runners en ejecuciones obsoletas del mismo PR o rama.
# Una ejecución nueva cancela la anterior del mismo grupo.
concurrency:
  group: android-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile instrumented tests
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin

      # Compile-only checks cannot catch runtime failures in Room, Keystore or Android lifecycle.
      - name: Run instrumented tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      # Exercises R8/resource shrinking on every PR; CI intentionally builds an unsigned release.
      - name: Build minified release APK
        run: gradle --no-daemon :app:assembleRelease

      # Solo se publica el APK de diagnóstico desde main; el AAB de Play se genera localmente en Android Studio.
      - name: Upload debug APK for testing
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: DietoExpress-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
